<!doctype html>
<html>
  <body style="margin:0;background:#f8f1e4;font-family:Arial,sans-serif;color:#25201b">
    <div style="max-width:560px;margin:0 auto;padding:32px 20px">
      <div style="background:#fffaf2;border-radius:24px;padding:32px">
        <div style="font-size:28px;font-weight:700">treeschool</div>
        <h1 style="font-size:30px;margin:28px 0 12px">Sign in to Treeschool</h1>
        <p style="font-size:16px;line-height:1.6">Use the secure button below, or enter the one-time code on the sign-in page.</p>
        <p style="margin:28px 0">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;border-radius:999px;background:#25201b;color:#fff;text-decoration:none;font-weight:700;padding:14px 24px">Sign in to Treeschool</a>
        </p>
        <p style="font-size:14px;color:#6f513e;margin-bottom:6px">One-time sign-in code</p>
        <div style="font-size:30px;font-weight:700;letter-spacing:8px">{{ .Token }}</div>
        <p style="font-size:13px;line-height:1.6;color:#6b625a;margin-top:28px">This link and code expire and can only be used once. If you did not request this email, you can ignore it.</p>
      </div>
    </div>
  </body>
</html>
