server {
  listen 80;
  server_name dev.treehomeschool.com;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name dev.treehomeschool.com;
  resolver 127.0.0.11 ipv6=off;

  ssl_certificate /etc/nginx/certs/dev.treehomeschool.com.pem;
  ssl_certificate_key /etc/nginx/certs/dev.treehomeschool.com-key.pem;

  client_max_body_size 205m;

  location / {
    set $frontend_upstream ts-frontend:3100;
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
